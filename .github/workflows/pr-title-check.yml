name: PR Title Check

on:
  pull_request:
    branches: [main]
    # "edited" re-runs the check when the title is changed
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-title:
    name: PR title contains "PR:"
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check PR title
        env:
          # Passed via env, not inlined in the script, so the title text is never run as code
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -qF 'PR:'; then
            echo "OK: PR title contains 'PR:'"
          else
            echo "::error title=PR title::The PR title must contain 'PR:' (for example 'PR: add login tests')."
            exit 1
          fi
