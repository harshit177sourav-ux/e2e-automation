name: PR Description Check

on:
  pull_request:
    branches: [main]
    # "edited" re-runs the check when the description is changed
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-description:
    name: PR description contains "PR:"
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check PR description
        env:
          # Passed via env, not inlined in the script, so the description text is never run as code
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qF 'PR:'; then
            echo "OK: PR description contains 'PR:'"
          else
            echo "::error title=PR description::The PR description must contain 'PR:' (for example 'PR: add login tests')."
            exit 1
          fi
